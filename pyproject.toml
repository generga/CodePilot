[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "codepilot-agent"
version = "0.1.0b1"
description = "Human-reviewed coding agent with test feedback and approval checkpoints"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
codepilot = [
    "pytest>=8.0,<10.0",
]
dev = [
    "pytest>=8.0",
    "ruff>=0.6",
    "fastapi>=0.115,<0.141",
    "httpx>=0.27",
    "starlette>=0.46,<1.0",
    "uvicorn>=0.30",
    "python-multipart>=0.0.9,<1.0",
]
api = [
    "fastapi>=0.115,<0.141",
    "starlette>=0.46,<1.0",
    "uvicorn>=0.30",
    "python-multipart>=0.0.9,<1.0",
]
worker = [
    "redis>=5.0,<7.0",
]
[tool.setuptools]
packages = []

[tool.pytest.ini_options]
testpaths = [
    "shared/tests",
    "projects/codepilot/tests",
    "projects/agentops/tests",
]
pythonpath = [
    "shared/src",
    "projects/codepilot/src",
    "projects/agentops/src",
]
addopts = "-q"
markers = [
    "integration: tests that require a live external dependency",
]

[tool.ruff]
line-length = 100
target-version = "py311"
