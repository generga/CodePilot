services:
  codepilot-api:
    build:
      context: .
    ports:
      - "127.0.0.1:8000:8000"
    env_file:
      - .env
    environment:
      CODEPILOT_ALLOWED_REPO_ROOTS: /repos
      CODEPILOT_SESSION_DB: /data/approvals.sqlite3
      CODEPILOT_EXECUTION_MODE: redis
      REDIS_URL: redis://redis:6379/0
    volumes:
      - ${CODEPILOT_REPO_ROOT:?set CODEPILOT_REPO_ROOT to a local repository directory}:/repos:rw
      - codepilot-data:/data
    restart: unless-stopped
    depends_on:
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/readyz', timeout=2)"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 20s
    read_only: true
    tmpfs:
      - /tmp

  codepilot-worker:
    build:
      context: .
    command: ["python", "-m", "codepilot.worker"]
    env_file:
      - .env
    environment:
      CODEPILOT_SESSION_DB: /data/approvals.sqlite3
      REDIS_URL: redis://redis:6379/0
      CODEPILOT_REDIS_STREAM: codepilot:tasks
      CODEPILOT_REDIS_GROUP: codepilot-workers
    volumes:
      - ${CODEPILOT_REPO_ROOT:?set CODEPILOT_REPO_ROOT to a local repository directory}:/repos:rw
      - codepilot-data:/data
    depends_on:
      redis:
        condition: service_healthy
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp

  redis:
    image: redis:7.4-alpine
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - codepilot-redis:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  codepilot-data:
  codepilot-redis:
