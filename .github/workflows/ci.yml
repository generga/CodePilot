name: quality
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    services:
      redis:
        image: redis:7.4-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s --health-timeout 3s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -e ".[dev,worker]"
      - run: python -m pytest
        env:
          CODEPILOT_TEST_REDIS_URL: redis://127.0.0.1:6379/0
      - run: python -m ruff check projects/codepilot/src projects/codepilot/tests projects/agentops/src shared/src
      - run: node --check projects/codepilot/web/app.js
      - run: python -m codepilot.evaluation
        env:
          PYTHONPATH: projects/codepilot/src:projects/agentops/src:shared/src
  container:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t codepilot:ci .
      - run: docker run --rm --read-only --tmpfs /tmp codepilot:ci python -m codepilot.evaluation
